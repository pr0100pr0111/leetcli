project_name: leetcli

builds:
  - id: leetcli
    main: ./main.go
    binary: leetcli
    ldflags: -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    builds: [leetcli]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - .leetcli.yaml.example
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: yourname
    name: leetcli
  draft: false
  prerelease: auto